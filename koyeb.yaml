# Koyeb configuration file
# For more information, see https://www.koyeb.com/docs/deploy-with-koyeb/koyeb-yaml
name: executive-insights-hub
services:
  - name: main
    type: web
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    regions:
      - fra # You can change this to your preferred region (e.g., was, sin, etc.)
    instance_types:
      - micro # This is the smallest instance type, suitable for small apps
    env:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: your-supabase-url
      - key: VITE_SUPABASE_ANON_KEY
        value: your-supabase-anon-key
    strategy:
      type: rolling
    # If you're using the Dockerfile we created
    builder: docker
    docker:
      dockerfile: Dockerfile
